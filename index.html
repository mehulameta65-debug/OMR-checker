<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KD OMR Checker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body style="margin:0;font-family:system-ui,sans-serif;background:#f5f5f5;color:#222">
<div id="app" style="max-width:720px;margin:0 auto;padding:12px"></div>
<script>
const BS='padding:9px 13px;margin:3px;border:0;border-radius:8px;background:#222;color:#fff;font-size:14px';
const BP=BS+';background:#0a7;font-size:16px;padding:12px 16px';
const IN='padding:8px;border:1px solid #bbb;border-radius:8px;font-size:14px;box-sizing:border-box';
const CARD='background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0002';
const LBL=['Q1 option A (top-left)','Q76 option D (top-right)','Q100 option D (bottom-right)','Q25 option A (bottom-left)'];
// ---- tweakables (column x-positions as fraction of Q1-A -> Q76-D) ----
const COLS=[[0,.0421,.0821,.1213],[.2896,.3298,.3689,.4090],[.5744,.6145,.6556,.6967],[.8718,.9139,.9570,1]];
const HW=.037, HH=.0375, N=11, INK=.62, FILL=.12, FAINT=.04;

const $=id=>document.getElementById(id);
let base=null, pts=[], scan=null, mode='cand', results=[], key=Array(100).fill(null);

$('app').innerHTML=`
<h3 style="margin:4px 0 8px">KD Campus OMR Checker</h3>

<div style="${CARD}">
 <div style="font-weight:700;margin-bottom:8px">Step 1 · Answer key (teacher uploads PDF)</div>
 <label style="${BP};display:inline-block">Upload answer PDF<input id="pf" type="file" accept="application/pdf" style="display:none"></label>
 <div id="kinfo" style="margin:6px 0;font-weight:600">No key yet</div>
 <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
  <label>Correct +<input id="mc" type="number" value="2" step="0.25" style="${IN};width:70px"></label>
  <label>Wrong −<input id="mn" type="number" value="0.5" step="0.25" style="${IN};width:70px"></label>
 </div>
 <details style="margin-top:8px"><summary style="cursor:pointer">Other ways to set / fix the key</summary>
  <textarea id="key" rows="3" placeholder="ABCD... (100 letters, - for blank) or 1:A 2:C ..." style="${IN};width:100%;margin-top:6px"></textarea>
  <label style="${BS};display:inline-block">Key from master OMR photo<input id="kf" type="file" accept="image/*" style="display:none"></label>
 </details>
</div>

<div id="s2" style="${CARD};opacity:.45">
 <div style="font-weight:700;margin-bottom:8px">Step 2 · Candidate response sheet</div>
 <input id="nm" placeholder="Candidate name / roll (optional)" style="${IN};width:100%">
 <label style="${BP};display:inline-block;margin-top:6px">Upload candidate OMR photo<input id="cf" type="file" accept="image/*" style="display:none"></label>
 <button id="rs" style="${BS};background:#777">Reset taps</button>
 <p id="msg" style="margin:6px 0;font-weight:600">Upload the answer PDF first.</p>
 <div id="sum" style="margin:6px 0"></div>
 <canvas id="cv" style="width:100%;touch-action:manipulation;background:#ddd;border-radius:8px"></canvas>
 <div id="flags"></div>
 <div id="review" style="margin-top:12px"></div>
 <button id="useKey" style="${BS};display:none">Use as answer key</button>
</div>

<div style="${CARD}">
 <div style="font-weight:700">All candidates (this session)</div><div id="res"></div>
</div>`;

const cv=$('cv'), cx=cv.getContext('2d',{willReadFrequently:true});
const msg=t=>$('msg').textContent=t;

function parseKey(t){ const k=Array(100).fill(null);
 if(/\d/.test(t)){ for(const m of t.matchAll(/(\d{1,3})\s*[:.\-)=]*\s*([A-Da-d])/g)){ const n=+m[1]; if(n>=1&&n<=100)k[n-1]=m[2].toUpperCase(); } }
 else [...t.replace(/[\s,]/g,'').toUpperCase()].slice(0,100).forEach((c,i)=>{ if('ABCD'.includes(c))k[i]=c; });
 return k; }
function kinfo(){ const n=key.filter(Boolean).length;
 $('kinfo').textContent=n?`✅ Key ready: ${n}/100 answers`:'No key yet';
 $('kinfo').style.color=n?'#080':'#222';
 $('s2').style.opacity=n?1:.45;
 if(n&&!base)msg('Now upload a candidate OMR photo.');
 if(scan&&mode==='cand'){ show(); showFlags(); }
}

// ---- Step 1: PDF key ----
$('pf').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f)return;
 if(typeof pdfjsLib==='undefined'){ $('kinfo').textContent='PDF reader failed to load. Check internet and refresh.'; return; }
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 $('kinfo').textContent='Reading PDF...';
 try{
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; let t='';
  for(let i=1;i<=pdf.numPages;i++){ const c=await (await pdf.getPage(i)).getTextContent(); t+=c.items.map(x=>x.str).join(' ')+'\n'; }
  const k=Array(100).fill(null);
  for(const m of t.matchAll(/(?<!\d)(\d{1,3})\s*[:.\-)=\]]*\s*\(?([A-Da-d])\)?(?![A-Za-z])/g)){
   const n=+m[1]; if(n>=1&&n<=100&&!k[n-1]) k[n-1]=m[2].toUpperCase(); }
  key=k; $('key').value=k.map(a=>a||'-').join(''); kinfo();
  const miss=k.map((a,i)=>a?null:i+1).filter(Boolean);
  if(!k.some(Boolean)) $('kinfo').textContent='No answers found. Scanned PDF or a different format? Send a sample to Mehul.';
  else if(miss.length) $('kinfo').textContent+=` · Missing: ${miss.slice(0,10).join(', ')}${miss.length>10?'…':''} (fix in "Other ways")`;
 }catch(err){ $('kinfo').textContent='Could not read PDF: '+err.message; }
};

// ---- Step 2: candidate sheet ----
function load(f,m){ if(!f)return;
 if(m==='cand'&&!key.some(Boolean)){ msg('Upload the answer PDF first (Step 1).'); return; }
 mode=m; const im=new Image();
 im.onload=()=>{ const k=Math.min(1,1600/im.width); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
  cx.drawImage(im,0,0,cv.width,cv.height); base=cx.getImageData(0,0,cv.width,cv.height);
  pts=[]; scan=null; $('flags').innerHTML=''; $('review').innerHTML=''; $('sum').innerHTML=''; btns(); msg('Tap centre of '+LBL[0]+' (pinch-zoom for accuracy)'); };
 im.src=URL.createObjectURL(f); }

function dot(p,c,r){ cx.beginPath(); cx.arc(p[0],p[1],r,0,7); cx.strokeStyle=c; cx.lineWidth=2; cx.stroke(); }
function redraw(){ cx.putImageData(base,0,0); pts.forEach(p=>dot(p,'#e11',6)); }

cv.onclick=e=>{ if(!base||pts.length>=4)return; const r=cv.getBoundingClientRect();
 pts.push([(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]); redraw();
 if(pts.length<4) msg('Tap centre of '+LBL[pts.length]); else run(); };

function H(p){ const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=p;
 const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
 const den=dx1*dy2-dx2*dy1, g=(dx3*dy2-dx2*dy3)/den, h=(dx1*dy3-dx3*dy1)/den;
 return (u,v)=>{ const w=g*u+h*v+1;
  return [((x1-x0+g*x1)*u+(x3-x0+h*x3)*v+x0)/w,((y1-y0+g*y1)*u+(y3-y0+h*y3)*v+y0)/w]; }; }

function run(){
 const f=H(pts), d=base.data, W=base.width, ans=[], flags=[];
 const p0=f(0,0), p1=f(COLS[0][1],0), rad=.2*Math.hypot(p1[0]-p0[0],p1[1]-p0[1]);
 for(let q=0;q<100;q++){
  const b=q/25|0, v=(q%25)/24, cells=[];
  for(let o=0;o<4;o++){ const vals=[];
   for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const [x,y]=f(COLS[b][o]+(i/(N-1)-.5)*HW, v+(j/(N-1)-.5)*HH);
    vals.push(d[((y|0)*W+(x|0))*4]??255); }
   cells.push(vals); }
  const s=cells.flat().sort((m,n)=>m-n), thr=s[s.length*.75|0]*INK;
  const fr=cells.map(c=>c.filter(t=>t<thr).length/c.length);
  const mx=Math.max(...fr), o1=fr.indexOf(mx), sec=[...fr].sort((m,n)=>n-m)[1];
  let a=null, fg=false;
  if(mx>=FAINT){
   if(mx>=FILL&&sec<Math.max(FAINT,mx*.5)) a='ABCD'[o1];
   else { fg=true; flags.push({q,fr:fr.map((x,i)=>'ABCD'[i]+Math.round(x*100)).join(' '),why:mx>=FILL?'multiple marks':'faint mark'}); } }
  ans.push(a);
  for(let o=0;o<4;o++){ const hit=a==='ABCD'[o];
   dot(f(COLS[b][o],v), fg&&fr[o]>=FAINT?'#f80':hit?'#0b0':'#aaa', hit||(fg&&fr[o]>=FAINT)?rad:3); }
 }
 scan={ans,flags,n:$('nm').value||('Candidate '+(results.length+1))};
 if(mode==='cand'){ scan.idx=results.push({n:scan.n,...sum()})-1; $('nm').value=''; }
 btns(); show(); showFlags();
 msg(mode==='key'?'Fix any flags, then tap "Use as answer key".':'Done. Green rings should sit on filled bubbles.');
 $('sum').scrollIntoView({behavior:'smooth',block:'center'}); }

function sum(){ const mc=+$('mc').value, mn=+$('mn').value; let c=0,w=0,u=0;
 scan.ans.forEach((a,i)=>{ if(!a)u++; else if(key[i]) a===key[i]?c++:w++; });
 return {c,w,u,s:+(c*mc-w*mn).toFixed(2),f:scan.flags.filter(x=>!x.done).length}; }

function show(){ const s=sum(), tot=100*(+$('mc').value);
 $('sum').innerHTML=mode==='key'?`Attempted ${100-s.u}`:
  `<div style="font-size:13px;color:#555">${scan.n}</div>
   <div><span style="font-size:36px;font-weight:800;color:#0a7">${s.s}</span> <span style="font-size:16px">/ ${tot}</span></div>
   <div>✔ ${s.c} correct · ✘ ${s.w} wrong · ${100-s.u} attempted · ${s.u} skipped${s.f?` · ⚠ ${s.f} to review below`:''}</div>`;
 if(mode==='cand') showReview();
 if(scan.idx!==undefined){ Object.assign(results[scan.idx],s); renderRes(); } }

function showReview(){
 if(!scan||mode!=='cand'){ $('review').innerHTML=''; return; }
 const rows=scan.ans.map((a,i)=>{
  const k=key[i], flag=scan.flags.find(f=>f.q===i&&!f.done);
  const state=flag?'Review':!a?'Blank':!k?'No key':a===k?'Correct':'Wrong';
  const color=flag?'#fff1dc':!a?'#f5f5f5':!k?'#eee':a===k?'#e9f8ed':'#fdecec';
  return `<tr style="background:${color}">
   <td style="padding:6px;border-bottom:1px solid #ddd">${i+1}</td>
   <td style="padding:6px;border-bottom:1px solid #ddd">${a||'—'}</td>
   <td style="padding:6px;border-bottom:1px solid #ddd">${k||'—'}</td>
   <td style="padding:6px;border-bottom:1px solid #ddd">${state}</td>
   <td style="padding:4px;border-bottom:1px solid #ddd">
    <select aria-label="Correct marked answer for question ${i+1}" onchange="setAnswer(${i},this.value)" style="${IN};padding:5px;width:80px">
     <option value="" ${!a?'selected':''}>Blank</option>
     ${['A','B','C','D'].map(x=>`<option value="${x}" ${a===x?'selected':''}>${x}</option>`).join('')}
    </select>
   </td>
  </tr>`;
 }).join('');
 $('review').innerHTML=`<details>
  <summary style="cursor:pointer;font-weight:700;margin-bottom:8px">Answer review · 100 questions</summary>
  <div style="overflow-x:auto">
   <table style="width:100%;border-collapse:collapse;text-align:left;font-size:14px">
    <thead><tr style="background:#eee">
     <th style="padding:7px">Q</th><th style="padding:7px">Marked</th><th style="padding:7px">Key</th><th style="padding:7px">Result</th><th style="padding:7px">Fix</th>
    </tr></thead>
    <tbody>${rows}</tbody>
   </table>
  </div>
 </details>`;
}

function showFlags(){ $('flags').innerHTML=scan.flags.filter(f=>!f.done).map(f=>`<div style="background:#fff;padding:8px;margin:4px 0;border-radius:8px;border:1px solid #f80">Q${f.q+1} · ${f.why} · ${f.fr}<br>${['A','B','C','D','blank'].map((l,i)=>`<button onclick="fix(${f.q},${i})" style="${BS};padding:6px 10px">${l}</button>`).join('')}</div>`).join(''); }

function setAnswer(q,value){
 if(!scan)return;
 scan.ans[q]=value||null;
 const flag=scan.flags.find(f=>f.q===q);
 if(flag)flag.done=true;
 showFlags();
 show();
}
function fix(q,i){ setAnswer(q,i<4?'ABCD'[i]:null); }
function btns(){ $('useKey').style.display=scan&&mode==='key'?'':'none'; }
function renderRes(){ $('res').innerHTML=results.map((r,i)=>`<div style="background:#f5f5f5;padding:8px;margin:4px 0;border-radius:8px;display:flex;justify-content:space-between"><span>${i+1}. ${r.n}</span><span>✔${r.c} ✘${r.w} · <b>${r.s}</b>${r.f?' ⚠'+r.f:''}</span></div>`).join(''); }

$('kf').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; load(f,'key'); };
$('cf').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; load(f,'cand'); };
$('rs').onclick=()=>{ if(!base)return; pts=[]; scan=null; redraw(); $('flags').innerHTML=''; $('review').innerHTML=''; $('sum').innerHTML=''; btns(); msg('Tap centre of '+LBL[0]); };
$('key').oninput=()=>{ key=parseKey($('key').value); kinfo(); };
$('mc').oninput=()=>{ if(scan){show();showFlags();} };
$('mn').oninput=()=>{ if(scan){show();showFlags();} };
$('useKey').onclick=()=>{ key=scan.ans.slice(); $('key').value=key.map(a=>a||'-').join(''); scan=null; btns(); $('flags').innerHTML=''; $('review').innerHTML=''; kinfo(); };
</script>
</body>
</html>
